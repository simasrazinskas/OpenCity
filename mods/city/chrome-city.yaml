# OpenCity HUD chrome, drawn at runtime by CityChromeGenerator (see chrome.yaml).
# city-icons: 32px HUD icons, city-icons-small: the same names at 16px. Designs: tools/uicityicons*.py, exported to
# bits/chrome/cityicons.vec by tools/uiexport.py. Aliases: speed-1/2/3 (= play/fast/faster) and electricity (= power).
# city-order-icons: 34x35 sidebar order tiles (+ -disabled / -active), one per OrderTiles entry of uistyle.yaml:
#   bulldoze infoviews budget stats chirper production policies progression districts tiles transit achievements advisor
#   options (40x38) power.
# Panels (9-slice): city-panel city-toolbar city-tooltip city-button[-hover|-pressed|-disabled]
# and city-button-highlighted[-hover|-pressed|-disabled].
city-icons:
	Inherits: ^CityChrome
	IconSet: city
	IconSize: 32

city-icons-small:
	Inherits: ^CityChrome
	IconSet: city
	IconSize: 16

city-order-icons:
	Inherits: ^CityChrome
	OrderTiles: 34, 35

city-panel:
	Inherits: ^CityChrome
	Panel: Dialog

city-toolbar:
	Inherits: ^CityChrome
	Panel: Toolbar

city-tooltip:
	Inherits: ^CityChrome
	Panel: Tooltip

city-button:
	Inherits: ^CityChrome
	Panel: Button
	State: Normal

city-button-hover:
	Inherits: ^CityChrome
	Panel: Button
	State: Hover

city-button-pressed:
	Inherits: ^CityChrome
	Panel: Button
	State: Pressed

city-button-disabled:
	Inherits: ^CityChrome
	Panel: Button
	State: Disabled

city-button-highlighted:
	Inherits: ^CityChrome
	Panel: Button
	State: Highlighted

city-button-highlighted-hover:
	Inherits: ^CityChrome
	Panel: Button
	State: HighlightedHover

city-button-highlighted-pressed:
	Inherits: ^CityChrome
	Panel: Button
	State: HighlightedPressed

city-button-highlighted-disabled:
	Inherits: ^CityChrome
	Panel: Button
	State: HighlightedDisabled

# Build icons of the transit, signature, battery and fish hub placeables (tools/uibuildicons.py).
city-buildicons-extra:
	Inherits: ^CityChrome
	Image: buildicons-extra.png
	Regions:
		battery: 148, 50, 48, 48
		cargoairport: 50, 50, 48, 48
		cargoharbor: 1, 50, 48, 48
		fish-hub: 99, 50, 48, 48
		metrostation: 99, 1, 48, 48
		railyard: 197, 1, 48, 48
		sig-bazaar: 99, 99, 48, 48
		sig-fuel-plant: 1, 148, 48, 48
		sig-garden-row: 1, 99, 48, 48
		sig-glass-hub: 197, 99, 48, 48
		sig-mall: 148, 99, 48, 48
		sig-sky-tower: 50, 99, 48, 48
		sig-villa: 197, 50, 48, 48
		taxidepot: 1, 1, 48, 48
		trainstation: 148, 1, 48, 48
		tramdepot: 50, 1, 48, 48
