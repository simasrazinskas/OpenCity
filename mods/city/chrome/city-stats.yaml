# Statistics window (CityStatsLogic, design/iso/ui/panels/statistics-*.png, tools/iso_ui_panels_finance.statistics):
# an icon tab per category, the checklist of the category's series on the left (colour key, zebra rows), the Year / 5 Years /
# All buttons, the line chart and the read-out strip of the sample under the pointer on the right.
CityPanel@CITY_STATS_PANEL:
	Logic: CityStatsLogic
	Family: info
	Placement: Center
	Avoid: CITY_ADVISOR_PANEL
	Width: 360
	Height: 260
	Visible: false
	Children:
		Container@LEFT:
			X: 4
			Y: 49
			Width: 140
			Height: PARENT_HEIGHT - 53
			Children:
				CityHeader@SERIES_HEADER:
					Width: PARENT_WIDTH
					Height: 12
					Text: label-stats-series
				ScrollPanel@SERIES:
					Y: 14
					Width: PARENT_WIDTH
					Height: PARENT_HEIGHT - 28
					TopBottomSpacing: 1
					ItemSpacing: 0
					ScrollbarWidth: 10
				Label@COUNT:
					Y: PARENT_HEIGHT - 11
					Width: PARENT_WIDTH
					Height: 11
					Font: Tiny
		Container@RIGHT:
			X: 150
			Y: 49
			Width: PARENT_WIDTH - 154
			Height: PARENT_HEIGHT - 53
			Children:
				Container@SCALE:
					Width: PARENT_WIDTH
					Height: 14
				CityGraph@GRAPH:
					Y: 17
					Width: PARENT_WIDTH
					Height: PARENT_HEIGHT - 17 - 20
					LeftMargin: 30
				Label@EMPTY:
					X: 30
					Y: 17
					Width: PARENT_WIDTH - 30
					Height: PARENT_HEIGHT - 17 - 20
					Font: Tiny
					Align: Center
				Background@READOUT:
					Y: PARENT_HEIGHT - 16
					Width: PARENT_WIDTH
					Height: 16
					Background: well-dark
					Children:
						Label@READOUT_TEXT:
							X: 4
							Width: PARENT_WIDTH - 8
							Height: PARENT_HEIGHT
							Font: Tiny

# One series of the checklist: checkbox, colour key, name (the whole row toggles).
Container@CITY_STATS_ROW:
	Width: 100
	Height: 13
	Children:
		CityRowBackground@BG:
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
		Checkbox@CHECK:
			X: 3
			Y: 1
			Width: 10
			Height: 10
		CitySwatch@KEY:
			X: 16
			Y: 5
			Width: 9
			Height: 3
		Button@NAME:
			X: 14
			Width: PARENT_WIDTH - 14
			Height: PARENT_HEIGHT
			Font: Tiny
			Align: Left
			LeftMargin: 15
			VisualHeight: 0
