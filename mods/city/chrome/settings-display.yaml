									Height: 14
									Font: Tiny
									MaxLength: 5
									Type: Integer
								Label@X:
									X: 146
									Width: 12
									Height: 14
									Font: TinyBold
									Align: Center
									Text: label-window-resolution-container-x
								TextField@WINDOW_HEIGHT:
									X: 158
									Width: 36
									Height: 14
									Font: Tiny
									MaxLength: 5
									Type: Integer
								DropDownButton@RESOLUTION_PRESET_DROPDOWN:
