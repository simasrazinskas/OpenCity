# Settings: Display tab (design/iso/ui/panels/settings-display.png). Widget ids and types are what DisplaySettingsLogic
# gets; rows are a 108 px label column and the control (RCT rows 14 high). Settings that do nothing in a city builder
# (status bars, target lines, relationship colours) stay in the hidden UNUSED container so the common logic can bind them.
Container@DISPLAY_PANEL:
	Logic: DisplaySettingsLogic
	Width: PARENT_WIDTH
	Height: PARENT_HEIGHT
	Children:
		Container@UNUSED:
			Visible: false
			Children:
				Container@STATUS_BAR_DROPDOWN_CONTAINER:
					Children:
						DropDownButton@STATUS_BAR_DROPDOWN:
				Container@TARGET_LINES_DROPDOWN_CONTAINER:
					Children:
						DropDownButton@TARGET_LINES_DROPDOWN:
				Container@PLAYER_STANCE_COLORS_CHECKBOX_CONTAINER:
					Children:
						Checkbox@PLAYER_STANCE_COLORS_CHECKBOX:
		ScrollPanel@SETTINGS_SCROLLPANEL:
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
			CollapseHiddenChildren: True
			Background: none
			ScrollbarWidth: 10
			TopBottomSpacing: 2
			ItemSpacing: 3
			Children:
				CityHeader@VIDEO_SECTION_HEADER:
					X: 2
					Width: PARENT_WIDTH - 16
					Height: 12
					Text: label-video-section-header
				Container@ROW:
					X: 2
					Width: PARENT_WIDTH - 16
					Height: 14
					Children:
						Label@VIDEO_MODE:
							Width: 108
							Height: 14
							Font: Tiny
							Text: label-video-mode-dropdown-container
						DropDownButton@MODE_DROPDOWN:
							X: 110
							Width: 160
							Height: 14
							Font: Tiny
				Container@ROW:
					X: 2
					Width: PARENT_WIDTH - 16
					Height: 14
					Children:
						Container@DISPLAY_SELECTION_CONTAINER:
							Width: PARENT_WIDTH
							Height: 14
							Children:
								Label@DISPLAY_SELECTION_LABEL:
									Width: 108
									Height: 14
									Font: Tiny
									Text: label-display-selection-container
								DropDownButton@DISPLAY_SELECTION_DROPDOWN:
									X: 110
									Width: 160
									Height: 14
									Font: Tiny
						Container@WINDOW_RESOLUTION_CONTAINER:
							Width: PARENT_WIDTH
							Height: 14
							Children:
								Label@WINDOW_SIZE:
									Width: 108
									Height: 14
									Font: Tiny
									Text: label-window-resolution-container-size
