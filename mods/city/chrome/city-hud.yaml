# Alert strip, advisor, achievements and map tile panels (wave 2). Owned by the UI work package; loaded by CityHudLogic.

Container@CITY_ALERTS:
	Logic: CityAlertsLogic
	X: (WINDOW_WIDTH - 226 - WIDTH) / 2
	Y: 6
	Width: 760
	Height: 30

Button@CITY_ALERT_CHIP:
	Width: 176
	Height: 28
	Font: TinyBold
	Children:
		ColorBlock@TIER:
			X: 4
			Y: 5
			Width: 8
			Height: 18

Background@CITY_ADVISOR_PANEL:
	Logic: CityAdvisorLogic
	X: 8
	Y: WINDOW_HEIGHT - HEIGHT - 52
	Width: 360
	Height: 200
	Background: dialog
	Visible: false
	Children:
		Label@TITLE:
			X: 12
			Y: 8
			Width: PARENT_WIDTH - 60
			Height: 22
			Font: Bold
			Shadow: true
			TextColor: E8A030
		Label@STEP:
			X: PARENT_WIDTH - 108
			Y: 8
			Width: 66
			Height: 22
			Font: TinyBold
			Align: Right
			TextColor: B4C4D0
		Button@CLOSE:
			X: PARENT_WIDTH - 36
			Y: 6
			Width: 28
			Height: 24
			TooltipText: button-advisor-close
			TooltipContainer: TOOLTIP_CONTAINER
			Children:
				Image@ICON:
					X: 6
					Y: 4
					ImageCollection: city-icons-small
					ImageName: close
		Label@TEXT:
			X: 12
			Y: 36
			Width: PARENT_WIDTH - 24
			Height: 62
			Font: Small
			WordWrap: true
			VAlign: Top
		Label@HINT:
			X: 12
			Y: 100
			Width: PARENT_WIDTH - 24
			Height: 46
			Font: TinyBold
			WordWrap: true
			VAlign: Top
			TextColor: 5CD67A
		CityBar@PROGRESS:
			X: 12
			Y: 150
			Width: PARENT_WIDTH - 24
			Height: 8
		Button@LOCATE:
			X: PARENT_WIDTH / 2 - 14
			Y: PARENT_HEIGHT - 32
			Width: 28
			Height: 24
			TooltipText: button-chirper-locate
			TooltipContainer: TOOLTIP_CONTAINER
			Children:
				Image@ICON:
					X: 6
					Y: 4
					ImageCollection: city-icons-small
					ImageName: locate
		Button@PREVIOUS:
			X: 12
			Y: PARENT_HEIGHT - 30
			Width: 80
			Height: 22
			Text: button-advisor-previous
			Font: TinyBold
		Button@NEXT:
			X: PARENT_WIDTH - 92
			Y: PARENT_HEIGHT - 30
			Width: 80
			Height: 22
			Text: button-advisor-next
			Font: TinyBold

Container@CITY_ACHIEVEMENT_ROW:
	Width: PARENT_WIDTH
	Height: 46
	Children:
		Image@ICON:
			X: 6
			Y: 7
			ImageCollection: city-icons
			ImageName: achievements
		Label@NAME:
			X: 48
			Y: 2
			Width: PARENT_WIDTH - 200
			Height: 20
			Font: Bold
			Shadow: true
		Label@DESCRIPTION:
			X: 48
			Y: 22
			Width: PARENT_WIDTH - 200
			Height: 20
			Font: Small
			TextColor: B4C4D0
		CityBar@PROGRESS:
			X: PARENT_WIDTH - 140
			Y: 10
			Width: 120
			Height: 12
		Label@XP:
			X: PARENT_WIDTH - 140
			Y: 26
			Width: 120
			Height: 16
			Font: TinyBold
			Align: Right
			TextColor: F2C94C

Background@CITY_ACHIEVEMENTS_PANEL:
	Logic: CityAchievementsLogic
	X: (WINDOW_WIDTH - 226 - WIDTH) / 2
	Y: (WINDOW_HEIGHT - HEIGHT) / 2 - 24
	Width: 600
	Height: 480
	Background: dialog
	Visible: false
	Children:
		Label@TITLE:
			Y: 10
			Width: PARENT_WIDTH
			Height: 28
			Font: MediumBold
			Align: Center
			Shadow: true
			Text: label-achievements-title
		Button@CLOSE:
			X: PARENT_WIDTH - 44
			Y: 8
			Width: 36
			Height: 32
			TooltipText: button-budget-close
			TooltipContainer: TOOLTIP_CONTAINER
			Children:
				Image@ICON:
					X: 2
					ImageCollection: city-icons
					ImageName: close
		Label@SUMMARY:
			X: 20
			Y: 44
			Width: PARENT_WIDTH - 40
			Height: 22
			Font: Bold
			Shadow: true
			TextColor: F2C94C
		ScrollPanel@LIST:
			X: 20
			Y: 72
			Width: PARENT_WIDTH - 40
			Height: PARENT_HEIGHT - 92
			TopBottomSpacing: 2
			ItemSpacing: 2

