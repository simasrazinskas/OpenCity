# OpenCity main menu over the shellmap (design/iso/ui/screens/mainmenu-*.png, tools/iso_ui_menus.mainmenu_stack):
# pixel logo, tagline plate and an RCT2 menu window with big icon buttons. CityMainMenuLogic centres STACK vertically.
Container@MAINMENU:
	Logic: CityMainMenuLogic
	Children:
		LogicKeyListener@GLOBAL_KEYHANDLER:
			Logic: MusicHotkeyLogic, ScreenshotHotkeyLogic, MuteHotkeyLogic
				StopMusicKey: StopMusic
				PauseMusicKey: PauseMusic
				PrevMusicKey: PrevMusic
				NextMusicKey: NextMusic
				TakeScreenshotKey: TakeScreenshot
				MuteAudioKey: ToggleMute
		LogicTicker@LAYOUT_TICKER:
		Container@STACK:
			X: (WINDOW_WIDTH - WIDTH) / 2
			Y: 40
			Width: 420
			Height: 416
			Children:
				Container@TITLE_BLOCK:
					Width: PARENT_WIDTH
					Height: 150
					Children:
						Image@LOGO:
							Width: PARENT_WIDTH
							Height: 120
							ImageCollection: menu-logos
							ImageName: logo
						CityPlate@TAGLINE:
							Y: 126
							Width: PARENT_WIDTH
							Height: 22
							Font: Bold
							Text: label-city-tagline
				Container@MENUS:
					X: (PARENT_WIDTH - WIDTH) / 2
					Y: 170
					Width: 264
					Height: 246
					Children:
						Background@MAIN_MENU:
							Width: PARENT_WIDTH
							Height: PARENT_HEIGHT
							Background: city-window
							Children:
								CityMenuButton@NEW_CITY_BUTTON:
									X: 6
									Y: 8
									Width: PARENT_WIDTH - 12
									Height: 34
									Text: button-city-new
									Sub: menu-new-city-sub
									Icon: cat_zoning
									Font: Bold
								CityMenuButton@CONTINUE_BUTTON:
									X: 6
									Y: 46
									Width: PARENT_WIDTH - 12
									Height: 34
									Text: menu-continue
									Icon: time_play
									Font: Bold
									Default: true
								CityMenuButton@LOAD_CITY_BUTTON:
									X: 6
									Y: 84
									Width: PARENT_WIDTH - 12
									Height: 34
									Text: button-city-load
									Icon: pnl_load
									Font: Bold
								CityMenuButton@SETTINGS_BUTTON:
									X: 6
									Y: 122
									Width: PARENT_WIDTH - 12
									Height: 34
									Text: button-settings-title
									Icon: pnl_settings
									Font: Bold
								CityMenuButton@EXTRAS_BUTTON:
									X: 6
									Y: 160
									Width: PARENT_WIDTH - 12
									Height: 34
									Text: button-extras-title
									Icon: ui_star
									Font: Bold
								CityMenuButton@QUIT_BUTTON:
									X: 6
									Y: 204
									Width: PARENT_WIDTH - 12
									Height: 34
									Text: button-quit
									Icon: ui_exit
									WellRamp: red
									Font: Bold
						Background@EXTRAS_MENU:
							Width: PARENT_WIDTH
							Height: 176
							Background: city-window
							Children:
								CityMenuButton@REPLAYS_BUTTON:
									X: 6
									Y: 8
									Width: PARENT_WIDTH - 12
									Height: 34
									Text: button-extras-menu-replays
									Icon: ui_play_video
									Font: Bold
								CityMenuButton@ASSETBROWSER_BUTTON:
									X: 6
									Y: 46
									Width: PARENT_WIDTH - 12
									Height: 34
									Text: button-extras-menu-assetbrowser
									Icon: ui_grid_view
									Font: Bold
								CityMenuButton@CREDITS_BUTTON:
									X: 6
									Y: 84
									Width: PARENT_WIDTH - 12
									Height: 34
									Text: label-credits-title
									Icon: ui_star
									Font: Bold
								CityMenuButton@BACK_BUTTON:
									X: 6
									Y: 130
									Width: PARENT_WIDTH - 12
									Height: 34
									Key: escape
									Text: button-back
									Icon: ui_left
									Font: Bold
		Label@VERSION_LABEL:
			X: 8
			Y: WINDOW_HEIGHT - 16
			Width: 400
			Height: 12
			Font: Tiny
			Shadow: true
			TextColor: FFF2D0
		Label@ENGINE_LABEL:
			X: WINDOW_WIDTH - WIDTH - 8
			Y: WINDOW_HEIGHT - 16
			Width: 400
			Height: 12
			Align: Right
			Font: Tiny
			Shadow: true
			TextColor: FFF2D0
			Text: menu-engine-credit
