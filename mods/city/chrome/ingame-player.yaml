# OpenCity in-game HUD, RCT2 style (design/iso/ui/screens/hud-*.png): top toolbar with three groups of icon buttons
# (game / speed / camera | build categories | panels), bottom status bar (money and population | news ticker and alerts |
# date, weather and demand) and floating windows (city-*.yaml). The toolbar is built and laid out by CityToolbarLogic
# (.Hud.cs: wide / medium / compact tiers by logical width, overflow into "More"), the status bar by CityStatusBarLogic.
Container@PLAYER_WIDGETS:
	Logic: LoadIngameChatLogic, CityHudLogic, CityStatusBarLogic, CityToolbarLogic
	Children:
		Container@CHAT_ROOT:
		VehiclePicker@VEHICLE_PICKER:
			Width: WINDOW_WIDTH
			Height: WINDOW_HEIGHT
		LogicTicker@SIDEBAR_TICKER:
		LogicTicker@CITY_TICKER:
		Container@CITY_TOOLBAR:
			Width: WINDOW_WIDTH
			Height: 32
			Children:
				Container@MENU_BUTTONS:
					Logic: MenuButtonsChromeLogic
					Children:
						MenuButton@OPTIONS_BUTTON:
							Key: escape
							Width: 30
							Height: 27
							Background: iconbutton
							VisualHeight: 0
							TooltipText: button-city-menu-tooltip
							TooltipContainer: TOOLTIP_CONTAINER
							DisableWorldSounds: true
							Children:
								CityIcon@ICON:
									Width: PARENT_WIDTH
									Height: PARENT_HEIGHT
									Icon: pnl_game_menu
									Size: 24
		Container@CITY_STATUSBAR:
			Y: WINDOW_HEIGHT - HEIGHT
			Width: WINDOW_WIDTH
			Height: 38
			Children:
				Background@LEFT:
					Background: city-statusbar
					Height: PARENT_HEIGHT
					Children:
						CityIcon@MONEY_ICON:
							X: 5
							Y: 3
							Width: 16
							Height: 16
							Icon: stat_money
						LabelWithTooltip@CASH:
							X: 25
							Y: 3
							Width: 100
							Height: 16
							Font: TinyBold
							TooltipContainer: TOOLTIP_CONTAINER
							TooltipTemplate: CITY_TOOLTIP
						CityIcon@BALANCE_ICON:
							X: 5
							Y: 19
							Width: 16
							Height: 16
						Label@BALANCE:
							X: 25
							Y: 19
							Width: 100
							Height: 16
							Font: Tiny
						Background@DIVIDER:
							X: 126
							Y: 4
							Width: 2
							Height: PARENT_HEIGHT - 8
							Background: city-etched-v
						CityIcon@POPULATION_ICON:
							X: 132
							Y: 3
							Width: 16
							Height: 16
							Icon: stat_population
						LabelWithTooltip@POPULATION:
							X: 152
							Y: 3
							Width: 92
							Height: 16
							Font: TinyBold
							TooltipContainer: TOOLTIP_CONTAINER
							TooltipTemplate: CITY_TOOLTIP
						Label@POPULATION_TREND:
							X: 200
							Y: 3
							Width: 12
							Height: 16
							Font: Tiny
						CityIcon@HAPPINESS_ICON:
							X: 132
							Y: 19
							Width: 16
							Height: 16
							Icon: stat_happiness
						CityBar@HAPPINESS:
							X: 152
							Y: 23
							Width: 92
							Height: 8
						FactorHover@HAPPINESS_HOVER:
							X: 132
							Y: 19
							Width: 112
							Height: 16
							TooltipContainer: TOOLTIP_CONTAINER
				Background@CENTER:
					Background: city-statusbar
					Height: PARENT_HEIGHT
					Children:
						Button@TICKER:
							X: 4
							Y: 4
							Width: PARENT_WIDTH - 8
							Height: 15
							Background: city-well-dark
							VisualHeight: 0
							TooltipContainer: TOOLTIP_CONTAINER
							Children:
								CityIcon@ICON:
									X: 3
									Width: 16
									Height: PARENT_HEIGHT
									Icon: pnl_chirper
								Label@TEXT:
									X: 22
									Width: PARENT_WIDTH - 26
									Height: PARENT_HEIGHT
									Font: Tiny
									TextColor: FFF4D6
						Container@ALERTS:
							Logic: CityAlertsLogic
							X: 4
							Y: 20
							Width: PARENT_WIDTH - 8
							Height: 16
				Background@RIGHT:
					Background: city-statusbar
					Height: PARENT_HEIGHT
					Children:
						CityIcon@DATE_ICON:
							X: 6
							Y: 3
							Width: 16
							Height: 16
							Icon: time_calendar
						Label@DATE:
							X: 26
							Y: 3
							Width: 110
							Height: 16
							Font: TinyBold
						CityIcon@TIME_ICON:
							X: 6
							Y: 19
							Width: 16
							Height: 16
							Icon: time_clock
						Label@TIME:
							X: 26
							Y: 19
							Width: 40
							Height: 16
							Font: Tiny
						CityIcon@WEATHER_ICON:
							X: 66
							Y: 19
							Width: 16
							Height: 16
						LabelWithTooltip@WEATHER:
							X: 86
							Y: 19
							Width: 60
							Height: 16
							Font: Tiny
							TooltipContainer: TOOLTIP_CONTAINER
							TooltipTemplate: CITY_TOOLTIP
						Label@DEMAND_LABEL:
							X: PARENT_WIDTH - 98
							Y: 2
							Width: 54
							Height: 10
							Font: Tiny
							Align: Right
							Text: label-city-statusbar-demand
						DemandBars@DEMAND_BARS:
							X: PARENT_WIDTH - 49
							Y: 3
							Width: 43
							Height: 33
							Font: Tiny
							TooltipContainer: TOOLTIP_CONTAINER
		LogicKeyListener@CITY_KEYS:

Button@CITY_TOOL_BUTTON:
	Width: 30
	Height: 27
	Background: iconbutton
	VisualHeight: 0
	DisableKeySound: true
	TooltipContainer: TOOLTIP_CONTAINER
	TooltipTemplate: CITY_TOOLTIP
	Children:
		CityIcon@ICON:
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
			Size: 24
