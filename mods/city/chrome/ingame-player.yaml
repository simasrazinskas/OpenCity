					Width: 34
					Height: 41
					VisualHeight: 0
					Background: command-button
					Key: CitySpeed1
					DisableKeySound: true
					TooltipText: button-city-speed-1-tooltip
					TooltipContainer: TOOLTIP_CONTAINER
					Children:
						Image@ICON:
							X: 1
							Y: 4
							ImageCollection: city-icons
							ImageName: play
				Button@SPEED_2:
					X: 70
					Width: 34
					Height: 41
					VisualHeight: 0
					Background: command-button
					Key: CitySpeed2
					DisableKeySound: true
					TooltipText: button-city-speed-2-tooltip
					TooltipContainer: TOOLTIP_CONTAINER
					Children:
						Image@ICON:
							X: 1
							Y: 4
							ImageCollection: city-icons
							ImageName: fast
				Button@SPEED_3:
					X: 105
					Width: 34
					Height: 41
					VisualHeight: 0
					Background: command-button
