# OpenCity in-game HUD: Dune 2000 style right sidebar, bottom-left command bar. Panels live in city-panels.yaml.
Container@PLAYER_WIDGETS:
	Logic: LoadIngameChatLogic, CityHudLogic, CityTopBarLogic, CityToolbarLogic
	Children:
		Container@CHAT_ROOT:
		VehiclePicker@VEHICLE_PICKER:
			Width: WINDOW_WIDTH - 226
			Height: WINDOW_HEIGHT
		LogicTicker@SIDEBAR_TICKER:
		LogicTicker@CITY_TICKER:
		Image@COMMAND_BAR_BACKGROUND:
			X: 0
			Y: WINDOW_HEIGHT - HEIGHT
			Width: 451
			Height: 43
			ImageCollection: commandbar
			ImageName: background
			ClickThrough: false
		Container@CITY_COMMANDS:
			X: 24
			Y: WINDOW_HEIGHT - HEIGHT - 9
			Width: 140
			Height: 41
			Children:
				Button@SPEED_PAUSE:
					X: 0
					Width: 34
					Height: 41
					VisualHeight: 0
					Background: command-button
					Key: CityPause
					DisableKeySound: true
					TooltipText: button-city-speed-pause-tooltip
					TooltipContainer: TOOLTIP_CONTAINER
					Children:
						Image@ICON:
							X: 1
							Y: 4
							ImageCollection: city-icons
							ImageName: pause
				Button@SPEED_1:
