# Citizen inspector (design/iso/ui/panels/citizen-overview.png, citizen-household.png, citizen-lifepath.png): people family, three tabs.
# Overview (portrait, age, education, activity, happiness and health, cash, home and work, thoughts), Household (members, money,
# home) and Life (the known facts of this citizen; the simulation keeps no event history, so there is no timeline).
# CityCitizenInfoLogic fills the pages.
Container@CITY_CITIZEN_MEMBER_ROW:
	Width: PARENT_WIDTH
	Height: 13
	Children:
		CityRowBackground@BG:
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
		Button@SELECT:
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
			VisualHeight: 0
		Label@NAME:
			X: 3
			Width: 84
			Height: PARENT_HEIGHT
			Font: Tiny
		Label@ROLE:
			X: 90
			Width: 50
			Height: PARENT_HEIGHT
			Font: Tiny
		Label@AGE:
			X: 138
			Width: 26
			Height: PARENT_HEIGHT
			Font: Tiny
			Align: Right
		Label@OCCUPATION:
			X: 172
			Width: PARENT_WIDTH - 174
			Height: PARENT_HEIGHT
			Font: Tiny

Container@CITY_CITIZEN_THOUGHT_ROW:
	Width: PARENT_WIDTH
	Height: 18
	Children:
		CityRowBackground@BG:
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
			Hover: false
		CityIcon@ICON:
			X: 3
			Width: 16
			Height: PARENT_HEIGHT
		Label@TEXT:
			X: 24
			Width: PARENT_WIDTH - 28
			Height: PARENT_HEIGHT
			Font: Tiny

Container@CITY_CITIZEN_FACT_ROW:
	Width: PARENT_WIDTH
	Height: 26
	Children:
		CityRowBackground@BG:
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
			Hover: false
		Background@BADGE:
			X: 4
			Y: 3
			Width: 20
			Height: 20
			Background: chip-yellow
			Children:
				CityIcon@ICON:
					Width: PARENT_WIDTH
					Height: PARENT_HEIGHT
		Label@TITLE:
			X: 30
			Y: 3
			Width: PARENT_WIDTH - 34
			Height: 12
			Font: Tiny
		Label@SUBTITLE:
			X: 30
			Y: 14
			Width: PARENT_WIDTH - 34
			Height: 10
			Font: Tiny

