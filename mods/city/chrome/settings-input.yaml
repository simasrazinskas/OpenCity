# Settings: Input tab, mouse part (design/iso/ui/panels/settings-input.png). The Mouse / Hotkeys buttons on top switch
# between this panel and HOTKEYS_PANEL (CitySettingsLogic). Unit and support power hints of the control scheme texts are
# left out: a city has none.
Container@INPUT_PANEL:
	Logic: InputSettingsLogic
	Width: PARENT_WIDTH
	Height: PARENT_HEIGHT
	Children:
		Button@SUBTAB_MOUSE:
			Width: 64
			Height: 14
			Font: Tiny
			Text: label-settings-mouse
		Button@SUBTAB_HOTKEYS:
			X: 66
			Width: 64
			Height: 14
			Font: Tiny
			Text: button-panel-hotkeys
		ScrollPanel@SETTINGS_SCROLLPANEL:
			Y: 18
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT - 18
			CollapseHiddenChildren: True
			Background: none
			ScrollbarWidth: 10
			TopBottomSpacing: 2
			ItemSpacing: 4
			Children:
				CityHeader@INPUT_SECTION_HEADER:
					X: 2
					Width: PARENT_WIDTH - 16
					Height: 12
					Text: label-input-section-header
				Container@ROW:
					X: 2
					Width: PARENT_WIDTH - 16
					Height: 14
					Children:
						Container@MOUSE_CONTROL_CONTAINER:
							Width: PARENT_WIDTH
							Height: 14
							Children:
								Label@MOUSE_CONTROL_LABEL:
									Width: 108
									Height: 14
									Font: Tiny
									Text: label-mouse-control-container
								DropDownButton@MOUSE_CONTROL_DROPDOWN:
									X: 110
									Width: 160
									Height: 14
									Font: Tiny
				Container@ROW:
					X: 2
					Width: PARENT_WIDTH - 16
					Height: 14
					Children:
