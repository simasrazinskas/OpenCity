# Milestones window (design/iso/ui/panels/milestones-*.png, tools/iso_ui_panels_people.py): people family, three icon tabs
# (milestones, development tree, achievements). CityProgressLogic switches the pages and builds the lists.
# The window is 500 x 344; CityProgressLogic shortens it (and the lists in it) to the work area on small screens.

Container@CITY_MILESTONE_ROW:
	Width: 240
	Height: 13
	Children:
		CityRowBackground@BG:
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
		Label@NUM:
			Width: 20
			Height: PARENT_HEIGHT
			Font: Tiny
			Align: Right
		Label@NAME:
			X: 26
			Width: 120
			Height: PARENT_HEIGHT
			Font: Tiny
		Label@XP:
			X: 120
			Width: 70
			Height: PARENT_HEIGHT
			Font: Tiny
			Align: Right
		CityIcon@STATE:
			X: 196
			Y: 0
			Width: 12
			Height: 12
			Size: 12

Container@CITY_UNLOCK_CHIP:
	Width: 109
	Height: 24
	Children:
		Background@BG:
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
			Background: well
		CityIcon@ICON:
			X: 3
			Y: 4
			Width: 16
			Height: 16
		Label@NAME:
			X: 22
			Width: PARENT_WIDTH - 24
			Height: PARENT_HEIGHT
			Font: Tiny

# One development tree row: tree icon + name, then the node cards.
Container@CITY_TREE_BLOCK:
	Width: 236
	Height: 35
	Children:
		Background@BG:
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
			Background: well
		CityIcon@ICON:
			X: 5
			Y: 3
			Width: 16
			Height: 16
		Label@NAME:
			X: 4
			Y: 21
			Width: 62
			Height: 10
			Font: Tiny

# A node card: owned (green), available (raised) or locked (dark, sunken); a yellow frame while selected.
Container@CITY_NODE_CARD:
	Width: 32
	Height: 33
	Children:
		ColorBlock@SELECTED:
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
			Visible: false
		Button@CARD:
			X: 2
			Y: 2
			Width: 28
			Height: 29
			Background: iconbutton
			IgnoreChildMouseOver: true
			TooltipContainer: TOOLTIP_CONTAINER
			TooltipTemplate: CITY_TOOLTIP
			Children:
				Background@OWNED:
					Width: PARENT_WIDTH
					Height: PARENT_HEIGHT
					Background: chip-green
					Visible: false
				Background@OPEN:
					Width: PARENT_WIDTH
					Height: PARENT_HEIGHT
					Background: card
				Background@LOCKED:
					Width: PARENT_WIDTH
					Height: PARENT_HEIGHT
					Background: card-well
					Visible: false
				CityIcon@ICON:
					X: 6
					Y: 2
					Width: 16
					Height: 16
				CityTint@DIM:
					X: 6
					Y: 2
					Width: 16
					Height: 16
					Visible: false
				Label@COST:
					Y: 19
					Width: PARENT_WIDTH
					Height: 9
					Font: Tiny
					Align: Center

# An achievement card (7 per row): unlocked cards are raised with a gold plate, locked ones sunken with a progress meter.
LabelWithTooltip@CITY_ACHIEVEMENT_CARD:
	Width: 65
	Height: 62
	IgnoreChildMouseOver: true
	TooltipContainer: TOOLTIP_CONTAINER
	TooltipTemplate: CITY_TOOLTIP
	Children:
		Background@DONE:
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
			Background: card
			Visible: false
		Background@TODO:
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
			Background: well
		ColorBlock@PLATE:
			X: (PARENT_WIDTH - 28) / 2
			Y: 3
			Width: 28
			Height: 28
			Visible: false
		CityIcon@ICON:
			X: (PARENT_WIDTH - 24) / 2
			Y: 5
			Width: 24
			Height: 24
			Size: 24
			Icon: pnl_achievements
		CityTint@DIM:
			X: (PARENT_WIDTH - 24) / 2
			Y: 5
			Width: 24
			Height: 24
			Visible: false
		Label@NAME:
			X: 2
			Y: 33
			Width: PARENT_WIDTH - 4
			Height: 18
			Font: Tiny
			Align: Center
			WordWrap: true
			VAlign: Top
		Label@XP:
			Y: 52
			Width: PARENT_WIDTH
			Height: 9
			Font: Tiny
			Align: Center
		CityBar@PROGRESS:
			X: 5
			Y: 54
			Width: PARENT_WIDTH - 10
			Height: 5
			Ramp: yellow
			Smooth: true

