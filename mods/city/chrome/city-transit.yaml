# Transit windows (CityTransitLogic, CityTransitLogic.Line.cs). RCT2 style: design/iso/ui/panels/transit-lines-*.png and
# transit-line-*.png, tools/iso_ui_panels_transit.py, shared templates in city-common.yaml. Transit family (blue).

# A line of the list (or a taxi stand): coloured number chip, name, stops, vehicles, usage meter, monthly profit.
Container@CITY_TRANSIT_LINE_ROW:
	Width: PARENT_WIDTH
	Height: 17
	Children:
		CityRowBackground@BG:
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
		ColorBlock@SWATCH:
			X: 3
			Y: 3
			Width: 26
			Height: 11
		Label@NUMBER:
			X: 3
			Y: 3
			Width: 26
			Height: 11
			Font: TinyBold
			Align: Center
		Label@NAME:
			X: 34
			Width: 120
			Height: PARENT_HEIGHT
			Font: Tiny
		Label@STOPS:
			Width: 34
			Height: PARENT_HEIGHT
			Font: Tiny
			Align: Right
		Label@VEHICLES:
			Width: 30
			Height: PARENT_HEIGHT
			Font: Tiny
			Align: Right
		CityBar@USAGE:
			Y: 4
			Width: 46
			Height: 9
			Smooth: true
		Label@PROFIT:
			Width: 62
			Height: PARENT_HEIGHT
			Font: Tiny
			Align: Right
		Button@SELECT:
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
			Background:
			VisualHeight: 0

# A vehicle of the line window: name, next stop, load and state.
Container@CITY_TRANSIT_VEHICLE_ROW:
	Width: PARENT_WIDTH
	Height: 14
	Children:
		CityRowBackground@BG:
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
		Label@NAME:
			X: 3
			Width: 70
			Height: PARENT_HEIGHT
			Font: Tiny
		Label@NEXT:
			X: 74
			Width: 120
			Height: PARENT_HEIGHT
			Font: Tiny
		Label@LOAD:
			Width: 56
			Height: PARENT_HEIGHT
			Font: Tiny
			Align: Right
		Label@STATE:
			Width: 66
			Height: PARENT_HEIGHT
			Font: Tiny
		Button@SELECT:
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
			Background:
			VisualHeight: 0

# Small - / + button of the vehicle count.
Button@CITY_TRANSIT_STEPPER:
	Width: 16
	Height: 16
	VisualHeight: 0
	DisableKeySound: true
	Children:
		CityIcon@ICON:
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
			Size: 12

