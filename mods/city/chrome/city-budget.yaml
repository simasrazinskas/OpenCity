# City Budget window (design/iso/ui/panels/budget-*.png, tools/iso_ui_panels_finance.py): finance family, six tabs
# (overview, income, expenses and service budgets, taxes, fees, loans) and a footer with funds and balance.
# CityBudgetLogic sets the tabs; pages are switched by visibility.
CityPanel@CITY_BUDGET_PANEL:
