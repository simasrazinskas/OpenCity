# OpenCity base chrome. Everything here is drawn at runtime by OpenRA.Mods.City/UIArt (CityChromeGenerator) at the exact
# device scale (window scale x UI scale), so it stays sharp pixel art at every size. Colours live in uistyle.yaml.
#
# The RCT2-style widget kit (`rct`, CityChromeGenerator.Rct.cs) is drawn for every window family F of uistyle.yaml:
#   F-window F-raised F-titlebar[-inactive] F-tab[-hover|-active] F-well F-well-dark F-trough F-toolbar F-statusbar
#   F-graph F-etched-h F-etched-v F-groupbox F-button[-state] F-button-default F-iconbutton[-state] F-textfield F-dropdown
#   F-checkbox F-slider-track F-slider-thumb F-scroll-trough F-item-hover|-selected|-zebra|-header F-card[-hover|-selected|
#   -locked] F-card-well, the shared OpenRA names (dialog dialog2..5 separator scrollheader scrollpanel-bg scrollitem-*
#   progressbar-bg/-thumb button-purchase checkbox-toggle ...), images F-scrollpanel-decorations F-dropdown-decorations
#   F-checkmark-tick F-checkmark-cross F-slider F-rct-bits/grip. Family `city` is also drawn without the `F-` prefix.
#   Shared: tooltip, rct-close/{normal,hover,pressed}, bar-<ramp>[-smooth], chip-<ramp>,
#   icons-N/<icon> and icons-N-disabled/<icon> (N = 12 16 20 24 32 logical px; atlases bits/chrome/iso/icons-*.png from
#   tools/iso_ui_export.py), thumbs-64/<actor> (build-menu thumbnails, bits/chrome/iso/thumbs-*.png).
# Other collections:
#   Images: name: <recipe> ...        glyph <name> [w h] | glyph-disabled <name> | icon <set>/<name> <size>
#                                     | art <recipe> <w> <h> | tile <kind> <state> [w h] | alias <collection>/<image> | empty

^CityChrome:
	Generator: CityChrome
	Style: city|uistyle.yaml
	Icons: cityicons.vec

rct:
	Inherits: ^CityChrome
	Dynamic: true
	Rct: true
	IconAtlas: iso/icons
	ThumbAtlas: iso/thumbs

sidebar-bits:
	Inherits: ^CityChrome
	Images:
		production-tooltip-time: glyph clock
		production-tooltip-power: glyph bolt
		production-tooltip-cost: glyph coin
		indicator-muted: glyph muted-indicator

power-icons:
	Inherits: ^CityChrome
	Images:
		power-normal: glyph bolt
		power-critical: glyph bolt-critical

flags:
	Inherits: ^CityChrome
	Images:
		city: glyph flag-city
		Random: glyph flag-random
		spectator: glyph flag-spectator

checkmark-mute:
	Inherits: ^CityChrome
	Images:
		unchecked: glyph speaker
		unchecked-pressed: glyph speaker-muted
		checked: glyph speaker-muted
		checked-pressed: glyph speaker

checkmark-mute-highlighted:
	Inherits: checkmark-mute

lobby-bits:
	Inherits: ^CityChrome
	Images:
		spawn-claimed: glyph spawn-claimed
		spawn-unclaimed: glyph spawn-unclaimed
		spawn-disabled: glyph spawn-disabled
		admin: glyph admin-tiny
		colorpicker: glyph colorpicker
		huepicker: glyph hue-marker
		kick: glyph kick
		protected: glyph lock
		protected-disabled: glyph lock-disabled
		authentication: glyph key
		authentication-disabled: glyph key-disabled
		admin-registered: glyph admin-registered
		admin-anonymous: glyph admin-anonymous
		player-registered: glyph player-registered
		player-anonymous: glyph player-anonymous
		bot: glyph bot

reload-icon:
	Inherits: ^CityChrome
	Images:
		enabled: glyph reload
		disabled-0: glyph spinner-0
		disabled-1: glyph spinner-1
		disabled-2: glyph spinner-2
		disabled-3: glyph spinner-3
		disabled-4: glyph spinner-4
		disabled-5: glyph spinner-5
		disabled-6: glyph spinner-6
		disabled-7: glyph spinner-7
		disabled-8: glyph spinner-8
		disabled-9: glyph spinner-9
		disabled-10: glyph spinner-10
		disabled-11: glyph spinner-11

music:
	Inherits: ^CityChrome
	Images:
		pause: glyph pause
		stop: glyph stop
		play: glyph play
		next: glyph next
		prev: glyph prev
		fastforward: glyph fastforward

editor:
	Inherits: ^CityChrome
	Images:
		select: glyph select
		tiles: glyph tiles
		overlays: glyph overlays
		actors: glyph actors
		tools: glyph tools
		history: glyph history
		erase: glyph erase
		copy: glyph copy
		paste: glyph paste
		undo: glyph undo
		redo: glyph redo

logos:
	Inherits: ^CityChrome
	Images:
		logo: art logo 256 256

loadscreen-stripe:
	Inherits: ^CityChrome
	Panel: Stripe
