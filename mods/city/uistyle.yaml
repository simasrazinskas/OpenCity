# OpenCity UI style: the single place to tweak the colours of the procedural chrome.
# Everything in chrome.yaml / chrome-city.yaml with `Generator: CityChrome` is drawn at runtime by
# OpenRA.Mods.City/Graphics/Chrome at the exact device scale (window scale x UI scale), using these colours.
# Colours are RRGGBB or RRGGBBAA.

Palette:
	# Outlines and shadows
	Outline: 120A06
	Shadow: 00000070
	# Panel bodies (dark warm brown) and sunken wells
	Panel: 28170F
	PanelLight: 3A2417
	PanelDark: 170D08
	Well: 110A06
	WellEdge: 7A5530
	WellEdgeDark: 4A3220
	# Dune 2000 house red, darkest to lightest
	Red0: 3A0D08
	Red1: 5C160D
	Red2: 7E2213
	Red3: A3321C
	Red4: CF4C2C
	# Gold / amber accents, darkest to lightest
	Gold0: 54360F
	Gold1: 8A5B1C
	Gold2: BF872C
	Gold3: E8B54E
	Gold4: FFE59E
	# Neutral (disabled) browns
	Grey0: 262019
	Grey1: 3A3129
	Grey2: 564A3F
	Grey3: 7A6B5D
	# Light sand (light glyphs)
	Sand: F2E0BA
	# Selection / hover fills of list items
	ItemHover: 3A2417
	ItemSelected: 6A1D10
	ItemSelectedEdge: BF872C
	# Outline colour of icons and glyphs
	IconOutline: 1A0B05

Settings:
	# Icon pixel grid: Scaled = art pixels are floor(scale) device pixels (crisp pixel art at every scale),
	# Device = art pixels are device pixels (smoother, more detail at large scales).
	IconPixels: Scaled
	# Hard (1 bit) icon edges instead of anti-aliased ones.
	IconHardEdges: false

# ---- RCT2-style chrome (design/iso/ui, tools/iso_ui_kit.py) -------------------------------------------
# 8-step colour ramps, 0 = darkest .. 7 = lightest. Every window family picks one ramp.
Ramps:
	brown: 24160a, 3e2712, 5c3a1c, 7a5028, 986838, b6864e, d2a86e, ecd09c
	orange: 341604, 5e2a06, 8a420a, b45c12, d8781e, ec983e, f6ba6c, fcdca6
	grey: 18191c, 2e3036, 484a52, 62646e, 7e808a, 9c9ea6, bcbec4, dedfe2
	green: 0a2210, 123c1a, 1c5826, 287432, 3a9040, 58ac56, 84c87a, b6e2a6
	blue: 0a1634, 122854, 1c3c78, 28549a, 3a70bc, 5890d4, 84b4e6, b6d4f4
	teal: 062628, 0c3e40, 165a5a, 227674, 349490, 52b0aa, 80ccc4, b2e6de
	red: 280808, 480c0c, 6a1412, 8e201c, b0322a, cc5446, e69a8c, f6cbbf
	purple: 1a0c2a, 2c1648, 422068, 5a2e86, 7442a2, 905ebc, b088d4, d2b8ec
	yellow: 382a06, 60480a, 8a6c12, b2901c, d4b02c, eaca4c, f6e080, fdf2c0
	sand: 2a2216, 463a28, 665640, 86745a, a69476, c4b496, ded2b8, f4ecdc

# Window families: ramp, body shade, accent ramp. The art of family F is named `F-<part>` (e.g. finance-button);
# family `city` is also drawn without a prefix (button, dialog, checkbox ...), for the shared widgets.
Families:
	city: brown, 5, orange
	finance: green, 6, yellow
	services: red, 6, sand
	transit: blue, 6, teal
	info: teal, 6, blue
	people: purple, 6, orange
	zoning: orange, 6, brown
	system: grey, 6, blue
	tooltip: yellow, 7, brown

# Text colours of the RCT chrome
Ink:
	Text: 140e08
	Light: fff4d6
	Shadow: 0c0804
	MoneyPositive: 0e5a16
	MoneyNegative: a01410
	MoneyPositiveLight: 7cf06c
	MoneyNegativeLight: ff6a50
	Graph: 10180e
	GraphGrid: 2e4a2a
