# Player-placed services and utilities. Owned by the services work package (WP SVC). See ARCHITECTURE.md and design/07-services.md.
# Capacity units: garbage kg, health beds, deathcare body slots, school seats, police jail cells, parks visits, telecom/welfare users.
# A "day" is one CityClock day (a calendar month, 2400 ticks); throughputs and rates are per such day.

Player:
	ServiceSimulation:
		PatrolRelief: 5
		WildfirePermille: 3

World:
	ServiceEffects:

^Service1x1:
	Inherits: ^CityStructure
	Inherits@shape: ^1x1Shape
	Inherits@statusicons: ^CityStatusIcons
	Bulldozable:
		RefundPercent: 50

^Service2x2:
	Inherits: ^CityStructure
	Inherits@shape: ^2x2Shape
	Inherits@statusicons: ^CityStatusIcons
	Building:
		Dimensions: 2,2
		Footprint: xx xx
	Bulldozable:
		RefundPercent: 50

^Service3x3:
	Inherits: ^CityStructure
	Inherits@shape: ^3x3Shape
	Inherits@statusicons: ^CityStatusIcons
	Building:
		Dimensions: 3,3
		Footprint: xxx xxx xxx
	Bulldozable:
		RefundPercent: 50

# Rubble of a burnt building: one 1x1 actor per footprint cell, gone after a while or when something is built on it.
rubble:
	Inherits: ^CitySprite
	Building:
		Dimensions: 1,1
		Footprint: x
		TerrainTypes: Clear, Rough
	WithSpriteBody:
	Bulldozable:
		AutoClear: true
	Rubble:
		Ticks: 1500

