# ---- utility buildings (the power plants, towers and pumps stay in services.yaml) ----
^NetStructure1x1:
	Inherits: ^CityStructure
	Inherits@shape: ^1x1Shape
	Bulldozable:
		RefundPercent: 50

^NetStructure2x2:
	Inherits: ^CityStructure
	Inherits@shape: ^2x2Shape
	Building:
		Dimensions: 2,2
		Footprint: xx xx
	Bulldozable:
		RefundPercent: 50

transformer:
	Inherits: ^NetStructure2x2
	Tooltip:
		Name: actor-transformer.name
	CityPlaceable:
		Cost: 2500
		Category: power
		DisplayOrder: 10
		Description: actor-transformer.description
	CityBuilding:
		Upkeep: 120
		PowerUse: 0
		WaterUse: 0
		MaxJobs: 1
	UtilityProducer:
		Transformer: 150

battery:
	Inherits: ^NetStructure1x1
	Tooltip:
		Name: actor-battery.name
	CityPlaceable:
		Cost: 4000
		Category: power
		DisplayOrder: 11
		Description: actor-battery.description
		UnlockPopulation: 1000
	CityBuilding:
		Upkeep: 80
		PowerUse: 0
		WaterUse: 0
		MaxJobs: 1
	UtilityProducer:
		BatteryCapacity: 600
		BatteryRate: 60

sewage-outlet:
