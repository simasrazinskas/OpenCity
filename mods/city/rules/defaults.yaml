# Shared actor templates. Agents inherit from these in their own rules files.

# Anything rendered in the world.
^CitySprite:
	BodyOrientation:
		QuantizedFacings: 1
	RenderSprites:
		Palette: city

# Static city structure with a footprint. Set Building.Footprint/Dimensions and HitShape per size.
^CityStructure:
	Inherits: ^CitySprite
	Building:
		Dimensions: 1,1
		Footprint: x
		TerrainTypes: Clear, Rough
	WithSpriteBody:
	Selectable:
		Priority: 2
	SelectionDecorations:
	Tooltip:
		GenericName: meta-citystructure-generic-name
	CityBuilding:
	Bulldozable:
	AppearsOnRadar:
	MapEditorData:
		Categories: City

^1x1Shape:
	HitShape:
		UseTargetableCellsOffsets: true
		Type: Rectangle
			TopLeft: -512, -512
			BottomRight: 512, 512

^2x2Shape:
	HitShape:
		UseTargetableCellsOffsets: true
		Type: Rectangle
			TopLeft: -1024, -1024
			BottomRight: 1024, 1024

^3x3Shape:
	HitShape:
		UseTargetableCellsOffsets: true
		Type: Rectangle
			TopLeft: -1536, -1536
			BottomRight: 1536, 1536

mpspawn:
	Inherits@shape: ^1x1Shape
	BodyOrientation:
	Interactable:
	EditorOnlyTooltip:
		Name: actor-mpspawn-name
	Immobile:
		OccupiesSpace: false
	RequiresSpecificOwners:
		ValidOwnerNames: Neutral
	MapEditorData:
		Categories: System
