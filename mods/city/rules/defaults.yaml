# Shared actor templates. Agents inherit from these in their own rules files.

# Depth-sorted static props on cells (road furniture, signals, lamps, pylons, masts): see CityPropLayer.
World:
	CityPropLayer:

# Anything rendered in the world. WithIsoSprite slices the sprites into 32 px footprint columns (RCT2 depth sorting),
# faces buildings toward their road, swaps state/season sprites, adds '-lit' frames at night and the ambient tint.
# It must stay before Selectable/Interactable so its footprint-plus-height mouse bounds win.
^CitySprite:
	BodyOrientation:
		QuantizedFacings: 1
	RenderSprites:
		Palette: city
	WithIsoSprite:

# Static city structure with a footprint. Set Building.Footprint/Dimensions and HitShape per size.
^CityStructure:
	Inherits: ^CitySprite
	Building:
		Dimensions: 1,1
		Footprint: x
		TerrainTypes: Clear, Rough
	WithSpriteBody:
	Selectable:
		Priority: 2
	SelectionDecorations:
	Tooltip:
		GenericName: meta-citystructure-generic-name
	CityBuilding:
	Bulldozable:
	AppearsOnRadar:
	MapEditorData:
		Categories: City

# Trees: one sprite each (no slicing), variant by cell, seasonal frames, stay visible in the see-through view.
^Tree:
	WithIsoSprite:
		Slice: false
		AutoFacing: false
		SeeThrough: false
		PickVariant: true
		Seasons: true
		FacingFrames: 1

# Buildings tied to water turn their water side toward the water (ART: the water side turns with the facing).
hydro-dam:
	WithIsoSprite:
		FaceWater: true

cargoharbor:
	WithIsoSprite:
		FaceWater: true

fish-hub:
	WithIsoSprite:
		FaceWater: true

# Burnt-building rubble: one variant per cell (idle = variant * 4 + facing), no animation.
rubble:
	WithIsoSprite:
		PickVariant: true

^1x1Shape:
	HitShape:
		UseTargetableCellsOffsets: true
		Type: Rectangle
			TopLeft: -512, -512
			BottomRight: 512, 512

^2x2Shape:
	HitShape:
		UseTargetableCellsOffsets: true
		Type: Rectangle
			TopLeft: -1024, -1024
			BottomRight: 1024, 1024

^3x3Shape:
	HitShape:
		UseTargetableCellsOffsets: true
		Type: Rectangle
			TopLeft: -1536, -1536
			BottomRight: 1536, 1536

mpspawn:
	Inherits@shape: ^1x1Shape
	BodyOrientation:
	Interactable:
	EditorOnlyTooltip:
		Name: actor-mpspawn-name
	Immobile:
		OccupiesSpace: false
	RequiresSpecificOwners:
		ValidOwnerNames: Neutral
	MapEditorData:
		Categories: System
