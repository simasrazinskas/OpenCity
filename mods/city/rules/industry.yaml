# Natural resources, extractor hubs and freight logistics. Owned by the industry work package. See mods/city/ARCHITECTURE.md.
World:
	NaturalResourceLayer:
	ExtractorAreaLayer:
	ExtractorAreaRenderer:

Player:
	ExtractorTool:
	Logistics:

^ExtractorHub2x2:
	Inherits: ^CityStructure
	Inherits@shape: ^2x2Shape
	Inherits@statusicons: ^CityStatusIcons
	Building:
		Dimensions: 2,2
		Footprint: xx xx
	Bulldozable:
		RefundPercent: 0

^ExtractorHub3x3:
	Inherits: ^CityStructure
	Inherits@shape: ^3x3Shape
	Inherits@statusicons: ^CityStatusIcons
	Building:
		Dimensions: 3,3
		Footprint: xxx xxx xxx
	Bulldozable:
		RefundPercent: 0

